name: Deploy Shoebox to Cloudflare

# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Optional repository secrets: GEMINI_API_KEY, SUPABASE_SERVICE_ROLE_KEY, RESEND_API_KEY.
# Optional repository variables: SUPABASE_URL, SUPABASE_ANON_KEY, EMAIL_FROM, APP_URL, GEMINI_MODEL.
# With only the two Cloudflare secrets the app deploys in "this device only" mode.
on:
  push:
    branches: [main, claude/compassionate-cray-lybdji]
    paths: ['shoebox/**', '.github/workflows/shoebox-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shoebox-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shoebox
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

      - name: Check the Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi

      - name: Create the R2 bucket for receipt photos
        id: r2
        run: |
          if out=$(npx --yes wrangler@4 r2 bucket create shoebox-receipts 2>&1) || echo "$out" | grep -qi "already exists"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "$out"
            echo "::warning::R2 isn't enabled on this Cloudflare account yet (Dashboard → R2 → enable). Deploying without photo storage; the app runs in 'this device only' mode until R2 is on."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Leave out the R2 binding when R2 is off
        if: steps.r2.outputs.ok != 'true'
        run: sed -i '/^\[\[r2_buckets\]\]/,/^bucket_name/d' wrangler.toml

      - name: Fill in settings from repository variables
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          APP_URL: ${{ vars.APP_URL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          node -e '
            const fs = require("fs");
            let toml = fs.readFileSync("wrangler.toml", "utf8");
            for (const k of ["SUPABASE_URL", "SUPABASE_ANON_KEY", "EMAIL_FROM", "APP_URL", "GEMINI_MODEL"]) {
              const v = (process.env[k] || "").trim();
              if (v) toml = toml.replace(new RegExp(`^${k} = .*$`, "m"), `${k} = ${JSON.stringify(v)}`);
            }
            fs.writeFileSync("wrangler.toml", toml);
          '

      - name: Deploy
        run: |
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "### Shoebox is live: ${url:-see the log above}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          node -e '
            const out = {};
            for (const k of ["GEMINI_API_KEY", "SUPABASE_SERVICE_ROLE_KEY", "RESEND_API_KEY"]) if (process.env[k]) out[k] = process.env[k];
            require("fs").writeFileSync("secrets.json", JSON.stringify(out));
            console.log(Object.keys(out).length ? `Uploading: ${Object.keys(out).join(", ")}` : "No optional secrets set.");
          '
          if [ "$(cat secrets.json)" != "{}" ]; then npx --yes wrangler@4 secret bulk secrets.json; fi
          rm -f secrets.json
