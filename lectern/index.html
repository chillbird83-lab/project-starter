<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lectern — Lecture recorder &amp; organiser</title>
  <meta name="description" content="Record university lectures on your phone, bookmark key moments, take notes and keep everything organised by course. Private, offline, free.">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" data-dark="1">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lectern">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <header id="nav" class="nav">
      <div class="nav-inner">
        <button type="button" id="nav-back" class="nav-btn back" data-action="back" aria-label="Back" hidden>
          <svg viewBox="0 0 12 20" width="12" height="20" aria-hidden="true"><path d="M10 2L2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <h2 id="nav-title" class="nav-title" aria-hidden="true"></h2>
        <div id="nav-right" class="nav-right"></div>
      </div>
    </header>

    <main id="view" class="view"><noscript><p style="padding:24px">Lectern needs JavaScript to run.</p></noscript></main>
  </div>

  <div id="dock" class="dock"></div>

  <nav class="tabbar" aria-label="Main">
    <div class="tabbar-inner">
      <button type="button" class="tab" data-action="tab" data-tab="today">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6L6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg><span>Today</span></button>
      <button type="button" class="tab" data-action="tab" data-tab="courses">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M10 4h4v16h-4zM14 5l4-.9a1.4 1.4 0 0 1 1.7 1.1l2.3 12a1.4 1.4 0 0 1-1.1 1.7L17 19.8"/></svg><span>Courses</span></button>
      <button type="button" class="tab-rec" data-action="record" aria-label="Record">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
      <button type="button" class="tab" data-action="tab" data-tab="library">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8v8M8 5v14M12 9v6M16 6v12M20 10v4"/></svg><span>Library</span></button>
      <button type="button" class="tab" data-action="tab" data-tab="week">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Week</span></button>
    </div>
  </nav>

  <div id="dim" class="dim" hidden role="button" aria-label="Tap to wake the screen">
    <span class="rec-dot" aria-hidden="true"></span>
    <span id="dim-time" class="dim-time">0:00</span>
    <span class="dim-hint">Still recording · tap to wake</span>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
